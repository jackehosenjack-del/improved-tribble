name: Deploy Project Zero Pages

on:
  push:
    branches: ["main"]
    paths:
      - "project-zero/site/**"
      - ".github/workflows/project-zero-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "project-zero-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project-zero/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

